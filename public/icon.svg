<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="soft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean card background -->
  <rect width="512" height="512" rx="120" fill="url(#soft-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#ffffff" stroke="#ccfbf1" stroke-width="6" filter="url(#tile-shadow)"/>

  <!-- Main Illustration Group -->
  <g transform="translate(106, 106)">
    <!-- Book -->
    <path d="M40 240c30-20 70-20 110 0 40-20 80-20 110 0V40c-30-20-70-20-110 0-40-20-80-20-110 0v200z" 
          stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="#f8fafc"/>
    <line x1="150" y1="40" x2="150" y2="240" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Colophon rectangular frame -->
    <rect x="170" y="75" width="70" height="115" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="5"/>
    <line x1="180" y1="100" x2="230" y2="100" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="120" x2="225" y2="120" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="140" x2="215" y2="140" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="160" x2="230" y2="160" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>

    <!-- Left page simple text lines -->
    <line x1="60" y1="90" x2="130" y2="90" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="120" x2="130" y2="120" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="150" x2="110" y2="150" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <!-- Reticle Brackets -->
    <g stroke="url(#teal-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M10 50 V10 H50"/>
      <path d="M250 10 H290 V50"/>
      <path d="M10 230 V270 H50"/>
      <path d="M290 230 V270 H250"/>
    </g>

    <!-- Scan Beam -->
    <line x1="15" y1="135" x2="285" y2="135" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-dasharray="12 10"/>
  </g>
</svg>
